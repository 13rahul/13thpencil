name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          timeout: 90s
          source: "."
          target: ${{ secrets.HOSTINGER_APP_PATH }}
          overwrite: true
          rm: false
          exclude: ".git,node_modules,.next,.playwright-mcp,.env,.env.local"

      - name: Install, migrate, and rebuild
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
            cd "${{ secrets.HOSTINGER_APP_PATH }}"
            npm ci
            npx prisma generate
            # migrate may fail until DATABASE_URL is a real Hostinger MySQL user — build still ships
            npx prisma migrate deploy || echo "migrate skipped"
            npm run build
            APP_ROOT="$(dirname "${{ secrets.HOSTINGER_APP_PATH }}")/current/nodejs"
            if [ -d "$APP_ROOT" ]; then
              rm -rf "$APP_ROOT/.next"
              cp -a .next "$APP_ROOT/.next"
              cp -a public "$APP_ROOT/public"
              cp -f package.json package-lock.json "$APP_ROOT/"
              mkdir -p "$APP_ROOT/tmp"
              date > "$APP_ROOT/tmp/restart.txt"
            fi
            echo DEPLOY_OK