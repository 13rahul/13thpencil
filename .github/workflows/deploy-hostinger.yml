name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
        run: |
          npm ci
          npx prisma generate
          npx next build

      - name: Upload built site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          timeout: 180s
          source: ".next,public,package.json,package-lock.json"
          target: ${{ secrets.HOSTINGER_APP_PATH }}
          overwrite: true
          rm: false
          exclude: ".next/cache"

      - name: Copy into live app and restart
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 10m
          script: |
            set -e
            SRC="${{ secrets.HOSTINGER_APP_PATH }}"
            APP_ROOT="$(dirname "$SRC")/current/nodejs"
            test -d "$SRC/.next"
            test -d "$APP_ROOT"
            rm -rf "$APP_ROOT/.next"
            cp -a "$SRC/.next" "$APP_ROOT/.next"
            mkdir -p "$APP_ROOT/public"
            cp -a "$SRC/public/." "$APP_ROOT/public/"
            mkdir -p "$APP_ROOT/tmp"
            date > "$APP_ROOT/tmp/restart.txt"
            echo DEPLOY_OK
